name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
      
      - name: Create assets directories
        working-directory: ./frontend
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons
          mkdir -p assets/sounds
          mkdir -p assets/i18n

      # ── Keystore Setup ──────────────────────────────────────────────────────
      # Decode the base64-encoded keystore stored in GitHub Secrets and write
      # the key.properties file so Gradle can sign the release APK properly.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > frontend/android/app/upload-keystore.jks
          cat > frontend/android/key.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF
          echo "Keystore decoded and key.properties written."
      # ────────────────────────────────────────────────────────────────────────

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew
      
      - name: Build Universal and Split APKs
        working-directory: ./frontend
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose > ../build.log 2>&1 || {
            echo "::error::Build failed! Showing last 120 lines of build log:"
            tail -n 120 ../build.log
            exit 1
          }
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/EthioWorkforce-Universal.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log
          retention-days: 7
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds
          path: |
            frontend/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
