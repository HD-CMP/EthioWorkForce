name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
      
      - name: Create assets directories
        working-directory: ./frontend
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons
          mkdir -p assets/sounds
          mkdir -p assets/i18n
      
      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew
      
      - name: Build Universal APK
        working-directory: ./frontend
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose > ../build.log 2>&1 || {
            echo "::error::Build failed! Showing last 120 lines of build log:"
            tail -n 120 ../build.log
            exit 1
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log
          retention-days: 7
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds
          path: |
            frontend/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
