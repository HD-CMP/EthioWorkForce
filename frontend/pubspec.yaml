  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  freezed_annotation: ^2.4.1
  
  shared_preferences: ^2.2.2
  
  intl: ^0.19.0
  
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  
  connectivity_plus: ^5.0.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  
  fl_chart: ^0.66.0
  
  file_picker: ^8.1.2
  
  excel: ^4.0.2
  csv: ^5.1.1
  
  logger: ^2.0.2+1
  
  permission_handler: ^11.1.0
  
