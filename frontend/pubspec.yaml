  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1
  
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  drift_dev: ^2.14.1
  injectable_generator: ^2.4.1
  freezed: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/i18n/
