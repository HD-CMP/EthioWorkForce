dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  get_it: ^7.6.4
